[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "databento-stream-downloader"
version = "0.2.0"
description = "Standalone Databento historical stream downloader"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
keywords = ["databento", "futures", "market-data", "dbn", "downloader"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "boto3==1.43.23",
  "botocore==1.43.23",
  "databento==0.79.0",
  "databento-dbn==0.59.0",
  "numpy==2.4.6",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "python-dotenv==1.2.2",
  "rich==15.0.0",
  "structlog==25.5.0",
  "zstandard==0.25.0",
]

[project.scripts]
databento-stream-downloader = "databento_stream_downloader.cli:main"
databento-stream-sync = "databento_stream_downloader.sync_cli:main"

[project.urls]
Homepage = "https://github.com/joshkeldam/databento-stream-downloader"
Documentation = "https://github.com/joshkeldam/databento-stream-downloader#readme"
Source = "https://github.com/joshkeldam/databento-stream-downloader"
Issues = "https://github.com/joshkeldam/databento-stream-downloader/issues"
Changelog = "https://github.com/joshkeldam/databento-stream-downloader/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "boto3-stubs[s3]==1.43.23",
  "hypothesis==6.155.1",
  "moto[s3]==5.2.1",
  "pip-audit==2.10.0",
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databento_stream_downloader"]
artifacts = ["src/databento_stream_downloader/universe.toml", "src/databento_stream_downloader/py.typed"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "C4",
  "PT",
  "RUF",
  "DTZ",
  "ARG",
  "SIM",
  "N",
  "S",
  "PERF",
  "LOG",
  "T20",
]
ignore = [
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "slow: slower filesystem or integration-style checks",
  "integration: tests that touch external services or recorded SDK fixtures",
]
